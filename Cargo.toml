[package]
name = "nesterm-rust"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Play NES games as ASCII art with readable text in your terminal"
license = "MIT"
repository = "https://github.com/vertigo-red/nesterm-rust"
readme = "README.md"
default-run = "nesterm"
include = ["src/**", "tests/**", "fonts/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "LICENSES-glyphs.txt", "THIRD_PARTY_NOTICES.md", "licenses/**", "docs/**", "scripts/**"]

[[bin]]
name = "nesterm"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
ctrlc = { version = "3.5", features = ["termination"] }
serde_json = "1.0"
tetanes-core = "=0.17.0"
unicode-width = "=0.1.14"

[dev-dependencies]
vt100 = "0.15.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
